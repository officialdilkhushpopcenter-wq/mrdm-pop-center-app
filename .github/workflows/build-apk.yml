name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/mrdmpopcenter/app
          mkdir -p app/src/main/assets/icons
          mkdir -p app/src/main/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; done

          [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/mrdmpopcenter/app/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f proguard-rules.pro ] && mv proguard-rules.pro app/

          if [ -f ic_launcher.png ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp ic_launcher.png app/src/main/res/mipmap-$d/ic_launcher.png
            done
          fi

          for f in index.html styles.css app.js manifest.json sw.js; do
            [ -f "$f" ] && mv "$f" app/src/main/assets/
          done
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-32.png; do
            [ -f "$f" ] && mv "$f" app/src/main/assets/icons/
          done

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mrdmpopcenter.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mrdmpopcenter.app"
                  minSdk 23
                  targetSdk 34
                  versionCode 2
                  versionName "1.1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          GRADLE

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          find app -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: ls -lh app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: mrdm-pop-center-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
